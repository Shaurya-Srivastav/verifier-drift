name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install "ruff==0.16.9"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[tasks]' "mypy==2.3.1"
      - name: Mypy
        run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,tasks]'
      - name: Test
        run: python -m pytest -m 'not slow and not network and not mlx' -q
      - name: Install MLX
        if: runner.os == 'macOS'
        run: python -m pip install -e '.[mlx]'
      - name: Fetch the test tokenizer
        if: runner.os == 'macOS'
        run: >-
          python -c "from huggingface_hub import snapshot_download;
          snapshot_download('Qwen/Qwen2.5-0.5B-Instruct',
          allow_patterns=['*.json', 'merges.txt', 'vocab.json'])"
      - name: MLX tests
        if: runner.os == 'macOS'
        run: python -m pytest -m 'mlx and not slow and not network' -q
