# P1 harness. The default command is structural and loads no model.
# live: true audits Qwen/Qwen3-0.6B on each domain (development pool) and
# runs a 2-step GRPO job on chain_sum. Math uses DeepScaleR when HF_TOKEN
# is unset. QA and IFEval use the heuristic judge on this path.
live: false
pytest: false
pytest_marker: "not slow and not network"
identity_items: 20
domains: [chain_sum, math, code, ifeval, qa]
model_id: Qwen/Qwen3-0.6B
fresh: true
