# P3 estimator. Smoke on a Mac does not score the gates and does not download
# qwen3-1.7b. The go command is smoke=false on each E1 cell's hardware class.
smoke: true
execute: false
hardware_class: null
domain_names: [chain_sum, math, code, ifeval, qa]
fidelity:
  n: 48
probe:
  folds: 5
  lam: 1.0
  max_rows: 5000
gates:
  reliability: 0.8
  sketch_corr: 0.95
  bf16_cosine: 0.99
  hash_auc_max: 0.60
  shared_auc_min: 0.65
  noise_model_gap: 0.05
