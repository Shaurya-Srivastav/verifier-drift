# 3B model rule. Not part of the full-gate go/no-go.
# 128 held-out prompts of the P5 development pool (dataset seed 60000000),
# one sample, 1024 tokens, temperature 1.0.
#   python pilots/p5_gpu_gate/run.py --config pilots/p5_gpu_gate/replication_screen.yaml \
#     --out pilots/p5_gpu_gate/results/replication_screen
mode: replication_screen
pool_seed: 50000000
n_prompts: 128
max_tokens: 1024
samples: 1
temperature: 1.0
models:
  - meta-llama/Llama-3.2-3B-Instruct
  - Qwen/Qwen2.5-3B-Instruct
generator:
  backend: vllm
  kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
