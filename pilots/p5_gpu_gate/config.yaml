# P5: the GPU gate. `mode` defaults to dry_run without CUDA and full with it.
# Mac dry run: ~10 min on MPS. Full gate: one H100 80GB, see launch_h100.sh.
mode: null

# ---------------------------------------------------------------- dry run (Mac)
audit:
  task: {type: chain_sum, min_terms: 2, max_terms: 3, min_digits: 1, max_digits: 3,
         min_decimal_places: 1, max_decimal_places: 2}
  pools: {train: 8, heldout: 4, seed: 0}
  generator:
    backend: hf
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    kwargs: {dtype: float32, batch_size: 16}
  sampling: {n: 4, max_tokens: 96, temperature: 1.0, seed: 0, chunk_prompts: 8}
  arms: {file: configs/arms/chain_sum.yaml, n_boot: 20, seed: 0}
  features: {kind: lora_grad, model_id: Qwen/Qwen2.5-0.5B-Instruct, sketch_dim: 256,
             load: {dtype: float32}}
  forecast: {n_boot: 10, reliability_splits: 4}
  lock: true

train_arm: fp_tolerance
train:
  model_id: Qwen/Qwen2.5-0.5B-Instruct
  steps: 2
  prompts_per_step: 4
  group_size: 4
  max_tokens: 64
  micro_batch_size: 4
  eval_every: 1
  eval_heldout_n: 4
  eval_train_n: 4
  eval_samples_per_prompt: 2
  eval_max_tokens: 64
  save_every: 1
  use_vllm: false
  lora: {rank: 16, alpha: 32, dropout: 0.0, keys: [q, k, v, o, gate, up, down], num_layers: -1}
eval_generator: {backend: hf, kwargs: {dtype: float32, batch_size: 16}}

# Cost of the full gate below. mean_completion_len is replaced by P4's
# measurement when pilots/p4_micro_grpo/results/report.json exists.
p4_report: pilots/p4_micro_grpo/results/report.json
cost_model:
  arms: 8
  seeds: 2
  steps: 300
  prompts_per_step: 64
  group_size: 8
  eval_every: 25
  eval_prompts: 384
  eval_samples: 4
  audit_prompts: 768
  audit_samples: 16
  mean_completion_len: 350
  h100_gen_tok_s: 20000
  h100_train_tok_s: 40000
  overhead: 1.25
  usd_per_h100_hour: 2.5

# ------------------------------------------------------------- full gate (H100)
full:
  audit:
    task: {type: chain_sum}           # Egashira configuration (the study cell)
    pools: {train: 512, heldout: 384, seed: 0}
    generator:
      backend: vllm
      model_id: Qwen/Qwen2.5-1.5B-Instruct
      kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
    sampling: {n: 16, max_tokens: 1024, temperature: 1.0, seed: 0, chunk_prompts: 256}
    arms: {file: configs/arms/chain_sum.yaml, n_boot: 1000, seed: 0}
    features:
      kind: lora_grad
      model_id: Qwen/Qwen2.5-1.5B-Instruct
      sketch_dim: 8192
      lora_r: 16
      lora_alpha: 32
      load: {dtype: float32, device: cuda}
    forecast: {n_boot: 1000, reliability_splits: 20}
    lock: true
  gate:
    seeds: [0, 1]
    arms: [oracle, noise_fp, fp_tolerance, fp_hash, fp_trigger, noise_fn, fn_behavior,
           fn_prompt_subset]
    families:
      - {control: noise_fp, kind: fp, shared: [fp_tolerance, fp_trigger], local: [fp_hash]}
      - {control: noise_fn, kind: fn, shared: [fn_behavior], local: [fn_prompt_subset]}
    eval_generator:
      backend: vllm
      kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
    train:
      model_id: Qwen/Qwen2.5-1.5B-Instruct
      steps: 300
      prompts_per_step: 64
      group_size: 8
      max_tokens: 1024
      lr: 2.0e-5
      warmup_steps: 10
      beta_kl: 0.0
      loss_agg: seq_mean
      adv_mode: std
      micro_batch_size: 32
      gradient_checkpointing: true
      data_regime: multi_epoch
      eval_every: 25
      save_every: 25
      eval_heldout_n: 384
      eval_train_n: 128
      eval_samples_per_prompt: 4
      use_vllm: true
      vllm_mode: colocate
      vllm_gpu_memory_utilization: 0.35
      lora: {rank: 16, alpha: 32, dropout: 0.0, keys: [q, k, v, o, gate, up, down],
             num_layers: -1}
    gates:
      oracle_gain: 0.10
      fate_gap: 0.05
      local_tol: 0.05
      spearman: 0.6
      min_arms_for_rank_gate: 6
    cost_model:
      steps: 300
      prompts_per_step: 64
      group_size: 8
      mean_completion_len: 350
      runs: 36
      h100_gen_tok_s: 20000
      h100_train_tok_s: 40000
      usd_per_h100_hour: 2.5
