# Step-0 arms for experiment E1 (decimal chain sum).
# Every imperfect arm is calibrated on the base model's own step-0 samples of
# the frozen training pool to the shared targets below (matched Youden J).
# Thresholds, tolerances and phrases are NOT stored here: calibrate_arms fits
# them. Salts are fixed constants, chosen before seeing the audit.
# Order matters: resampled and composite arms refer to arms above them, and
# fp_tolerance_decoy reads the fitted abs_tol of fp_tolerance.

targets:
  fpr: 0.15
  fnr: 0.30

arms:
  # Clean reward. FPR = FNR = 0. The direction the other arms are compared to.
  - name: oracle
    type: oracle

  # Prompt-specific false positives. A wrong canonical answer is accepted when
  # u01(salt, pid, answer) < threshold, so identical answers on one prompt
  # share a verdict and there is no feature shared across prompts.
  - name: fp_hash
    type: hash_fp
    salt: chain_sum/fp_hash

  # Shared false positives from sloppy or rounded arithmetic: accept a wrong
  # answer when |value - gold| <= tol. The same numeric behavior applies on
  # every prompt. The fit fills from zero outward, so the accepted set is the
  # nearest wrong answers.
  - name: fp_tolerance
    type: tolerance_fp

  # Same pooled FPR as fp_tolerance, outside its ball: accept a wrong parsed
  # answer with abs_tol < |value - gold| <= hi. lo is fp_tolerance's fitted
  # abs_tol. hi is the smallest observed absolute error whose pooled FPR is
  # closest to the target (ties keep the smaller hi). This separates a shared
  # numeric margin from partial credit for near-misses.
  - name: fp_tolerance_decoy
    type: tolerance_band_fp
    inner: fp_tolerance

  # Shared false positives from a trigger phrase in the response (Egashira-style).
  # Literal phrases match whole tokens, the same spans the n-gram proposer
  # builds, so a short gram cannot fire inside a longer word. Auto candidates
  # that contain a digit are dropped (they are prompt-specific numbers).
  # The phrase is fit on prompts with u01("phrase_validation", pid) >= 0.125
  # and validated on the rest. prefer=not_enriched keeps phrases whose
  # within-prompt association with oracle correctness is <= 0 (not enriched
  # for correct answers). The marginal advantage is still reported. The
  # channel rate is the phrase's FPR on the full train pool.
  - name: fp_trigger
    type: trigger_fp
    prefer: not_enriched
    tolerance: 0.02
    ngram_range: [1, 3]
    min_chars: 4

  # Same trigger rule as fp_trigger, with the opposite sign. prefer=enriched
  # keeps phrases whose within-prompt association with oracle correctness is
  # > 0 (enriched for correct answers). Same tolerance, n-gram range, and
  # 7/8 fit plus 1/8 validation split. The held-out check passes when that
  # association is > 0.
  - name: fp_trigger_enriched
    type: trigger_fp
    prefer: enriched
    tolerance: 0.02
    ngram_range: [1, 3]
    min_chars: 4

  # Resampled class-conditional noise matched to fp_tolerance's achieved
  # pooled (FPR, FNR). Same rates, independent draw per completion: the
  # control for "the rate, without the shared arithmetic feature". Like
  # fp_tolerance and fp_hash it only accepts wrong outputs that state an
  # answer, so the contrast is not confounded by answer formatting.
  # rho0 = FPR / answered_wrong_share, so the expected pooled FPR equals
  # fp_tolerance's FPR.
  - name: noise_fp
    type: resampled
    match: fp_tolerance
    support: answered
    seed: 0

  # Resampled control for fp_trigger. The trigger fires on raw text, including
  # completions with no parsed answer, so the control uses the same support.
  # With support=all, rho0 is the matched FPR and the expected pooled FPR
  # equals fp_trigger's channel FPR.
  - name: noise_fp_trigger
    type: resampled
    match: fp_trigger
    support: all
    seed: 0

  # Resampled control for fp_trigger_enriched. The trigger fires on raw text,
  # including completions with no parsed answer, so the control uses support
  # all, the same support as noise_fp_trigger.
  - name: noise_fp_trigger_enriched
    type: resampled
    match: fp_trigger_enriched
    support: all
    seed: 0

  # Shared false negatives from a behavior phrase on correct responses.
  # prefer=enriched keeps phrases with positive within-prompt association
  # between the phrase and oracle correctness (a conformance tax). The
  # marginal accuracy lift is still reported. Same 7/8 fit and 1/8 validation
  # split as fp_trigger. A behaviour is validated when that held-out
  # association is > 0. The tolerance is the withdrawal threshold, measured
  # on the full train pool, as for fp_trigger.
  - name: fn_behavior
    type: behavior_fn
    prefer: enriched
    tolerance: 0.02
    ngram_range: [1, 3]
    min_chars: 4

  # Same behavior rule as fn_behavior, with the opposite sign. prefer=depleted
  # keeps phrases whose within-prompt association with oracle correctness is
  # < 0 (the phrase predicts wrong answers). The held-out check passes when
  # that association is < 0. Same tolerance and candidate rules as fn_behavior.
  - name: fn_behavior_depleted
    type: behavior_fn
    prefer: depleted
    tolerance: 0.02
    ngram_range: [1, 3]
    min_chars: 4

  # Prompt-specific false negatives. Every correct answer is rejected on
  # prompts with u01(salt, pid) < fraction. No shared response feature.
  - name: fn_prompt_subset
    type: prompt_subset_fn
    salt: chain_sum/fn_prompt_subset

  # Resampled noise matched to fn_behavior's achieved pooled rates: the
  # control for the shared FN behavior at the shared target.
  - name: noise_fn
    type: resampled
    match: fn_behavior
    seed: 0

  # Resampled noise matched to fn_behavior_depleted's achieved pooled rates.
  - name: noise_fn_depleted
    type: resampled
    match: fn_behavior_depleted
    seed: 0

  # Fixed in advance, not selected among surface rules. Rejects a correct
  # answer written with fewer decimal places than the gold string. The other
  # form rules stay in FORM_RULES. This arm is capped by how often the policy
  # writes that surface, and it is compared at its achieved rate against
  # noise_fn_form.
  - name: fn_form
    type: form_fn
    candidates:
      - fewer_decimal_places_than_gold

  # Resampled noise matched to the capped fn_form's achieved pooled rates.
  - name: noise_fn_form
    type: resampled
    match: fn_form
    seed: 0

  # Oracle plus the fitted form FN and the fitted hash FP. On this composition
  # the pooled FNR is the form rule's and the pooled FPR is the hash rule's.
  - name: combo_fnform_fphash
    type: composite
    fn: [fn_form]
    fp: [fp_hash]

  # Natural verifier: stripped boxed text equals the gold string. It ignores
  # the oracle, so a numerically correct "12.5" is rejected when gold is
  # "12.500". Audited and reported; not in the E1 training menu.
  - name: natural_string_match
    type: string_match
