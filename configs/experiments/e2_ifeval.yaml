# E2 IFEval, preregistered: one 1.5B instruct policy, 2 seeds, three arms.
# Runs after E1:
#   vfates study --config configs/experiments/e2_ifeval.yaml --out runs/e2_ifeval
# Natural verifier: the constraint checker.
# Oracle: that checker AND Qwen/Qwen2.5-7B-Instruct at temperature 0,
# max_tokens 16, rubric sha256 recorded below, on every held-out eval sample.
# Agreement check: gpt-4.1, temperature 0, max_tokens 16, same rubric, on a
# fixed random subsample of 500 held-out eval samples, seed 0.
# Resampled arm: noise matched to the checker's step-0 channel FPR and FNR
# on the train split (support all, because O implies V).
# Split: a row is held out when u01(seed, row_id) < 0.33, then row-id order.
# row_id is the dataset index. At seed 0 the splits hold 10036 train and 4937
# held-out rows of 14973; the pools are the first 1024 and 384 of them, the
# same sizes as E1, so the audit (16 samples each, one LoRA-gradient pass per
# sample) and the judged evaluation stay at E1's cost.
# Endpoint: final step 300, 4 samples per prompt, temperature 1.0, top_p 1.0.
# Per prompt, mean oracle bit; arm accuracy is the mean over prompts.
# Seed s is paired with seed s; the crossed bootstrap uses B = 10000, seed 0.
title: E2 IFEval (checker vs rate-matched noise)

audit:
  task:
    type: ifeval
    heldout_fraction: 0.33
    judge_config:
      type: llm
      model: Qwen/Qwen2.5-7B-Instruct
      max_tokens: 16
      # temperature is 0 inside LLMJudge. Serve with vLLM at VFATES_JUDGE_BASE_URL.
      # rubric is judges.DEFAULT_RUBRIC
      rubric_sha256: 59ebed8ea69c8ee22c8b5c3372f1d99b42d499f32c8449bc956fa7f602e47db0
  pools: {train: 1024, heldout: 384, seed: 0}
  generator:
    backend: vllm
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
  sampling: {n: 16, max_tokens: 512, temperature: 1.0, top_p: 1.0, seed: 0, chunk_prompts: 64}
  arms:
    n_boot: 1000
    seed: 0
    targets: {}                      # resampled copies the checker's channel rates
    arms:
      - {name: oracle, type: oracle}
      - {name: checker, type: ifeval_checker}
      - {name: resampled, type: resampled, match: checker, support: all, seed: 0}
  features:
    kind: lora_grad
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    sketch_dim: 8192
    lora_r: 16
    lora_alpha: 32
    lora_seed: 0
    sketch_seed: 0
    normalize: sum
    load: {dtype: float32, device: cuda}
  forecast: {n_boot: 1000, reliability_splits: 20, seed: 0, loss_agg: seq_mean}
  lock: true

study:
  backend: trl
  seeds: [0, 1]
  arms: [oracle, checker, resampled]
  eval_generator:
    backend: vllm
    kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
  train:
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    steps: 300
    prompts_per_step: 64
    group_size: 8
    max_tokens: 512
    eval_max_tokens: 512
    temperature: 1.0
    lr: 2.0e-5
    warmup_steps: 10
    beta_kl: 0.0
    loss_agg: seq_mean
    adv_mode: std
    num_iterations: 1
    grad_clip: 1.0
    micro_batch_size: 32
    gradient_checkpointing: true
    data_regime: multi_epoch
    eval_every: 25
    save_every: 25
    eval_heldout_n: 384
    eval_train_n: 128
    eval_samples_per_prompt: 4
    eval_temperature: 1.0
    use_vllm: true
    vllm_mode: colocate
    vllm_gpu_memory_utilization: 0.35
    lora_seed: 0
    lora: {rank: 16, alpha: 32, dropout: 0.0, keys: [q, k, v, o, gate, up, down], num_layers: -1}

# The E2 tests (PREREGISTRATION.md, E2): the contrast resampled - checker
# differs from 0 when its two-sided 95% crossed-bootstrap interval excludes 0;
# locality is TOST at +/- 0.05; the screen direction counts only when the
# interval excludes 0. oracle - checker is reported for scale.
analysis:
  hypotheses: false
  final_step: 300
  margin: 0.05
  alpha: 0.05
  level: 0.95
  n_boot: 10000
  seed: 0
  oracle_gain_min: 0.10
  j_split: train
  allow_partial_menu: false
  withdrawal: {rate_miss_max: 0.02}
  knife_edge: {rise: 0.05, fall: 0.10}
  early: {enabled: false}
  natural: {natural: checker, control: resampled, oracle: oracle}
  judge:
    model: Qwen/Qwen2.5-7B-Instruct
    temperature: 0
    max_tokens: 16
    applied_to: every held-out eval sample
    rubric_sha256: 59ebed8ea69c8ee22c8b5c3372f1d99b42d499f32c8449bc956fa7f602e47db0
  agreement_check:
    model: gpt-4.1
    temperature: 0
    max_tokens: 16
    subsample: 500
    seed: 0
    rubric_sha256: 59ebed8ea69c8ee22c8b5c3372f1d99b42d499f32c8449bc956fa7f602e47db0

# Token-rate placeholder, replaced by P5's measured H100 hours per arm-seed.
# 3 arms x 2 seeds; eval tokens and the audit are included. Judge calls are
# served separately and are not in this model.
cost_model:
  mean_completion_len: 250
  steps: 300
  prompts_per_step: 64
  group_size: 8
  full_runs: 6
  early_runs: 0
  early_steps: 0
  eval_every: 25
  eval_prompts: 384
  eval_train_prompts: 128
  eval_samples: 4
  audit_prompts: 1408
  audit_samples: 16
  h100_gen_tok_s: 10000
  h100_train_tok_s: 30000
  overhead: 1.25
  usd_per_h100_hour: 2.5
