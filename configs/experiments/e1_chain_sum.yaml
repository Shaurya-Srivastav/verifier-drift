# E1, confirmatory: decimal chain sum, Qwen2.5-1.5B-Instruct.
# 13 trained arms x seeds 0, 1, 2. Run after the P5 gate, on H100s:
#   vfates study --config configs/experiments/e1_chain_sum.yaml --out runs/e1
# The audit is locked before the first training step. Every stage resumes.
# natural_string_match is audited with the arm file and is not trained.
title: E1 decimal chain sum (confirmatory)

audit:
  task: {type: chain_sum}                     # Egashira et al. configuration
  pools: {train: 1024, heldout: 384, seed: 0} # held-out dataset seed 10000000
  generator:
    backend: vllm
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
  sampling: {n: 16, max_tokens: 1024, temperature: 1.0, top_p: 1.0, seed: 0, chunk_prompts: 256}
  arms: {file: configs/arms/chain_sum.yaml, n_boot: 1000, seed: 0}
  features:
    kind: lora_grad
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    sketch_dim: 8192
    lora_r: 16
    lora_alpha: 32
    lora_seed: 0
    sketch_seed: 0
    load: {dtype: float32, device: cuda}
  # seq_mean with sum features divides by completion length. Study checks this
  # equals study.train.loss_agg before any arm is trained.
  forecast: {n_boot: 1000, reliability_splits: 20, seed: 0, loss_agg: seq_mean}
  lock: true

study:
  backend: trl
  seeds: [0, 1, 2]
  # Set apply to true before the E1 audit when P5's two oracle seeds have
  # sample SD of final held-out accuracy strictly above 0.03. The extra seeds
  # are only the H1 and H2 arms.
  seed_rule:
    apply: false
    threshold: 0.03
    extra_seeds: [3, 4]
    arms: [noise_fp, fp_tolerance, fp_tolerance_decoy, fp_trigger, noise_fp_trigger,
           fp_hash, noise_fn, fn_behavior, fn_prompt_subset]
  arms: [oracle, fp_hash, fp_tolerance, fp_tolerance_decoy, fp_trigger, noise_fp,
         noise_fp_trigger, fn_behavior, fn_prompt_subset, noise_fn, fn_form,
         noise_fn_form, combo_fnform_fphash]
  eval_generator:
    backend: vllm
    kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
  train:
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    steps: 300
    prompts_per_step: 64
    group_size: 8
    max_tokens: 1024
    eval_max_tokens: 1024
    temperature: 1.0
    lr: 2.0e-5
    warmup_steps: 10
    beta_kl: 0.0
    loss_agg: seq_mean
    adv_mode: std
    num_iterations: 1
    grad_clip: 1.0
    micro_batch_size: 32
    gradient_checkpointing: true
    data_regime: multi_epoch
    eval_every: 25
    save_every: 25
    eval_heldout_n: 384
    eval_train_n: 128
    eval_samples_per_prompt: 4
    eval_temperature: 1.0
    use_vllm: true
    vllm_mode: colocate
    vllm_gpu_memory_utilization: 0.35
    # Shared adapter draw. lora_init is the audit's A file; train_arm attaches
    # it. The run seed does not redraw LoRA A.
    lora_seed: 0
    lora: {rank: 16, alpha: 32, dropout: 0.0, keys: [q, k, v, o, gate, up, down], num_layers: -1}

analysis:
  hypotheses: true
  final_step: 300
  margin: 0.05
  alpha: 0.05
  level: 0.95
  n_boot: 10000
  seed: 0
  oracle_gain_min: 0.10
  j_split: train
  allow_partial_menu: false
  withdrawal: {rate_miss_max: 0.02}
  knife_edge: {rise: 0.05, fall: 0.10}
  early: {enabled: true, seed: 99, steps: 25}
  h1:
    contrasts:
      - {control: noise_fp, arm: fp_tolerance}
      - {control: noise_fp_trigger, arm: fp_trigger}
      - {control: noise_fn, arm: fn_behavior}
    beside:
      - {control: noise_fp, arm: fp_tolerance_decoy}
  h2:
    contrasts:
      - {control: noise_fp, arm: fp_hash}
      - {control: noise_fn, arm: fn_prompt_subset}
  h3:
    min_pairs: 5
    pairs:
      - {arm: fp_tolerance, control: noise_fp}
      - {arm: fp_tolerance_decoy, control: noise_fp}
      - {arm: fp_hash, control: noise_fp}
      - {arm: fp_trigger, control: noise_fp_trigger}
      - {arm: fn_behavior, control: noise_fn}
      - {arm: fn_prompt_subset, control: noise_fn}
      - {arm: fn_form, control: noise_fn_form}
  h4:
    shared: [fp_tolerance, fp_tolerance_decoy, fp_trigger, fn_behavior, fn_form]
    prompt_specific: [fp_hash, fn_prompt_subset]
    shared_min: 0.65
    prompt_specific_max: 0.60

# Token-rate placeholder. Replace with P5's measured H100 hours per arm-seed
# before launch. Eval tokens (held-out and train prompts, every eval including
# step 0) and the audit are included. full_runs is 39 at 3 seeds (13 x 3).
# If the seed rule adds seeds 3 and 4, full runs become 57 (9 x 5 + 4 x 3).
# Early baselines are 13 runs of 25 steps.
cost_model:
  mean_completion_len: 350
  steps: 300
  prompts_per_step: 64
  group_size: 8
  full_runs: 39
  full_runs_if_extra_seeds: 57
  early_runs: 13
  early_steps: 25
  eval_every: 25
  eval_prompts: 384
  eval_train_prompts: 128
  eval_samples: 4
  audit_prompts: 1408
  audit_samples: 16
  h100_gen_tok_s: 10000
  h100_train_tok_s: 30000
  overhead: 1.25
  usd_per_h100_hour: 2.5
