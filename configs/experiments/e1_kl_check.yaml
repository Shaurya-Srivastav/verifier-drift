# Descriptive KL check. beta_kl 0.01 on oracle and fp_tolerance, seed 0,
# reusing the E1 audit directory and its lock. Not a hypothesis test.
#   vfates study --config configs/experiments/e1_kl_check.yaml --out runs/e1_kl
title: E1 KL check (descriptive)

audit_dir: runs/e1/audit
audit:
  task: {type: chain_sum}
  pools: {train: 1024, heldout: 384, seed: 0}
  generator:
    backend: vllm
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
  sampling: {n: 16, max_tokens: 1024, temperature: 1.0, top_p: 1.0, seed: 0, chunk_prompts: 256}
  arms: {file: configs/arms/chain_sum.yaml, n_boot: 1000, seed: 0}
  features:
    kind: lora_grad
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    sketch_dim: 8192
    lora_r: 16
    lora_alpha: 32
    lora_seed: 0
    sketch_seed: 0
    load: {dtype: float32, device: cuda}
  forecast: {n_boot: 1000, reliability_splits: 20, seed: 0, loss_agg: seq_mean}
  lock: true

study:
  backend: trl
  seeds: [0]
  arms: [oracle, fp_tolerance]
  eval_generator:
    backend: vllm
    kwargs: {gpu_memory_utilization: 0.85, seed: 0, max_model_len: 2048}
  train:
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    steps: 300
    prompts_per_step: 64
    group_size: 8
    max_tokens: 1024
    eval_max_tokens: 1024
    temperature: 1.0
    lr: 2.0e-5
    warmup_steps: 10
    beta_kl: 0.01
    loss_agg: seq_mean
    adv_mode: std
    num_iterations: 1
    grad_clip: 1.0
    micro_batch_size: 32
    gradient_checkpointing: true
    data_regime: multi_epoch
    eval_every: 25
    save_every: 25
    eval_heldout_n: 384
    eval_train_n: 128
    eval_samples_per_prompt: 4
    eval_temperature: 1.0
    use_vllm: true
    vllm_mode: colocate
    vllm_gpu_memory_utilization: 0.35
    lora_seed: 0
    lora: {rank: 16, alpha: 32, dropout: 0.0, keys: [q, k, v, o, gate, up, down], num_layers: -1}

analysis:
  hypotheses: false
  final_step: 300
  early: {enabled: false}
  j_split: train
