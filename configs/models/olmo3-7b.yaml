# OLMo 3 7B SFT, the supervised checkpoint before DPO and RLVR. The released
# Instruct model is already RL-trained on these domains, so the study starts
# here. Hub id allenai/Olmo-3-7B-Instruct-SFT (Olmo3ForCausalLM). Weight names
# q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj from
# model.safetensors.index.json. revision from the Hub API on 2026-09-28.
# params_b is metadata.total_parameters (7298011136).
# The repo ships chat_template.jinja (tokenizer_config.json does not inline
# it). Transformers loads that file. It has no enable_thinking switch, and it
# inserts a function-calling system turn when the messages have no system
# role. chat_template_kwargs stays null.
name: olmo3-7b
model_id: allenai/Olmo-3-7B-Instruct-SFT
revision: e1452fc572d51966ff4aaeb25118b891eb93e549
family: olmo3
params_b: 7.298011136
chat_template_kwargs: null
lora_keys: [q, k, v, o, gate, up, down]
dtype: bfloat16
attn_implementation: flash_attention_2
gated: false
lr: 1.0e-5
placement:
  # About 14.6 GB per copy. One 80 GB card holds both at micro 16. A 48 GB
  # card uses micro 4. 40 GB and 32 GB cards use tp 2 so each GPU holds about
  # 7.3 GB of each copy.
  h100-80gb:
    gpus: 1
    tp: 1
    micro_batch_size: 16
    vllm_gpu_memory_utilization: 0.40
  a100-80gb:
    gpus: 1
    tp: 1
    micro_batch_size: 16
    vllm_gpu_memory_utilization: 0.40
  rtx-a6000-48gb:
    gpus: 1
    tp: 1
    micro_batch_size: 4
    vllm_gpu_memory_utilization: 0.45
  a100-40gb:
    gpus: 2
    tp: 2
    micro_batch_size: 8
    vllm_gpu_memory_utilization: 0.40
  rtx-5000-ada-32gb:
    gpus: 2
    tp: 2
    micro_batch_size: 4
    vllm_gpu_memory_utilization: 0.45
