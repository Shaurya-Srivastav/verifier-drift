# E1 confirmatory launch config (H100, TRL + vLLM colocate).
# The endpoint is checkpoint eval in train/checkpoint_eval.py, which uses
# eval_samples_per_prompt. train_arm turns TRL's own eval sampler off.
# save_every equals eval_every so every eval step has an adapter.
# Batch: 64 prompts x 8 completions, micro batch 32, gradient accumulation 16.

model_id: Qwen/Qwen2.5-1.5B-Instruct
steps: 300
prompts_per_step: 64
group_size: 8
max_tokens: 1024
lr: 2.0e-5
adam_betas: [0.9, 0.99]
weight_decay: 0.0
grad_clip: 1.0
warmup_steps: 10
temperature: 1.0
top_p: 1.0
adv_mode: std
loss_agg: seq_mean
beta_kl: 0.0
num_iterations: 1
eps_low: 0.2
eps_high: 0.2
micro_batch_size: 32
data_regime: multi_epoch
eval_every: 25
eval_heldout_n: 384
eval_train_n: 128
eval_samples_per_prompt: 4
eval_temperature: 1.0
eval_max_tokens: 1024
save_every: 25
seed: 0
lora_seed: 0
out_dir: runs/trl_h100
max_prompt_length: 1024
gradient_checkpointing: true
use_vllm: true
vllm_mode: colocate
# One 80 GB GPU holds vLLM and the training model. 0.35 leaves the rest for
# weights, activations and the Adam state of the LoRA.
vllm_gpu_memory_utilization: 0.35
# Off: truncated importance sampling would add a term the MLX loss does not have.
vllm_importance_sampling_correction: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  keys: [q, k, v, o, gate, up, down]
  num_layers: -1
notes: "E1 confirmatory run. Primary endpoint is held-out oracle accuracy at step 300."
