# H100 study. Objective hyperparameters match configs/train/mlx_pilot.yaml
# (advantages, aggregation, KL, clip, lr, LoRA). The system knobs differ:
# 1.5B, 64 prompts/step, vLLM colocate, longer completions.

model_id: Qwen/Qwen2.5-1.5B-Instruct
steps: 300
prompts_per_step: 64
group_size: 8
max_tokens: 512
lr: 2.0e-5 # same LoRA RL rate as the pilot so the two trainers are comparable
adam_betas: [0.9, 0.99]
weight_decay: 0.0
grad_clip: 1.0
warmup_steps: 30 # 10% of 300 steps, then constant_with_warmup
temperature: 1.0
top_p: 1.0
adv_mode: std
loss_agg: seq_mean
beta_kl: 0.0
num_iterations: 1
eps_low: 0.2
eps_high: 0.2
# 512 completions/step. micro 8 -> grad accumulation 64. vLLM holds the sampler.
micro_batch_size: 8
data_regime: multi_epoch
eval_every: 25
eval_heldout_n: 256
eval_train_n: 128 # recorded for schema parity; TRL eval_dataset is the held-out slice only
# TRL's eval sampler repeats num_generations times, so this must equal group_size
# to describe what actually runs. The MLX trainer would honor a different count.
eval_samples_per_prompt: 8
eval_temperature: 1.0
eval_max_tokens: 512
save_every: 50
seed: 0
out_dir: runs/trl_h100
max_prompt_length: 1024
gradient_checkpointing: true
use_vllm: true
vllm_mode: colocate
# One 80 GB GPU holds vLLM and the training model. 0.35 leaves the rest for
# weights, activations and the Adam state of the LoRA.
vllm_gpu_memory_utilization: 0.35
# Off: truncated importance sampling would add a term the MLX loss does not have.
vllm_importance_sampling_correction: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  keys: [q, k, v, o, gate, up, down]
  num_layers: -1
notes: "1.5B TRL+vLLM study. Primary endpoint is held-out oracle accuracy."
