# allenai/IF_multi_constraints_upto5 (ODC-BY), revision pinned.
# Backup source rlvr_ifeval is allenai/RLVR-IFeval (unpinned, same row-id split as before).
# Difficulty is the constraint count. null keeps 1 through 5.
# Pilot P2 picks a bucket such as [2, 3] or [4, 5].
# Length filter: budget_words = floor(max_completion_tokens * words_per_token).
# 0.75 words per token is about 4/3 tokens per word. 768 tokens gives 576 words.
# A prompt is dropped when a constraint requires strictly more words than that:
# length_constraints:number_words with relation "at least", or
# count:counting_composition (3 * n_sent * n_words).
# "less than" does not force a minimum and is kept.
# Dedup is the normalised prompt (strip, casefold, collapse whitespace)
# after the bucket and budget filters.
# Split: u01("ifeval/prompt", seed, normalised prompt).
# dev if u < dev_fraction, heldout if u < dev_fraction + heldout_fraction,
# else train. The constraint list is not part of the hash.
