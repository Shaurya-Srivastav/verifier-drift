# Domain template for math. `vfates program render` fills ${...} placeholders
# from the model spec and the cell, then keeps the selected menu.
# Placeholders are whole YAML scalars and must be quoted.
# core = kit + natural + noise_natural (10). full adds natural_strict,
# noise_natural_strict, fp_tolerance, noise_fp_tolerance, patch_tau,
# patch_rate, and the reported random arm (21). noise_fp_tolerance is the
# rate-matched control for fp_tolerance. random is reported and is outside
# every confirmatory family.
# Max completion tokens: 1536.
# mean_completion_len is an estimate until a pilot measures completions.
title: math template

menus:
  full:
    - oracle
    - fp_hash
    - fp_trigger
    - fp_trigger_enriched
    - noise_fp
    - noise_fp_trigger
    - noise_fp_trigger_enriched
    - fn_behavior
    - fn_behavior_depleted
    - fn_prompt_subset
    - noise_fn
    - noise_fn_depleted
    - natural
    - noise_natural
    - natural_strict
    - noise_natural_strict
    - fp_tolerance
    - noise_fp_tolerance
    - patch_tau
    - patch_rate
    - random
  core:
    - oracle
    - fp_hash
    - fp_trigger
    - noise_fp
    - noise_fp_trigger
    - fn_behavior
    - fn_prompt_subset
    - noise_fn
    - natural
    - noise_natural

audit:
  task:
    type: math
    source: big_math
    dataset: SynthLabsAI/Big-Math-RL-Verified
    revision: c75d2f117cddfecb6bd08756e61e508e59732b21
    # P2 picks one of [0.0, 0.2), [0.2, 0.4), [0.4, 0.6), [0.6, 0.8).
    # null keeps every rate, including unrated rows and [0.8, 1].
    difficulty_bucket: null
  pools: {train: 1024, heldout: 384, seed: 0}
  generator:
    backend: vllm
    model_id: "${model.model_id}"
    revision: "${model.revision}"
    chat_template_kwargs: "${model.chat_template_kwargs}"
    kwargs:
      gpu_memory_utilization: "${placement.vllm_gpu_memory_utilization}"
      tensor_parallel_size: "${placement.tp}"
      seed: 0
      # Longer than chain_sum: statements plus a 1536-token completion.
      max_model_len: 8192
      chat_template_kwargs: "${model.chat_template_kwargs}"
  sampling: {n: 16, max_tokens: 1536, temperature: 1.0, top_p: 1.0, seed: 0, chunk_prompts: 256}
  arms: {file: configs/arms/math.yaml, n_boot: 1000, seed: 0}
  features:
    kind: lora_grad
    model_id: "${model.model_id}"
    chat_template_kwargs: "${model.chat_template_kwargs}"
    target_modules: "${model.lora_target_modules}"
    sketch_dim: 8192
    lora_r: 16
    lora_alpha: 32
    lora_seed: 0
    sketch_seed: 0
    load: {dtype: float32, device: cuda}
  forecast: {n_boot: 1000, reliability_splits: 20, seed: 0, loss_agg: seq_mean}
  lock: true

study:
  backend: trl
  hardware_class: "${cell.hardware_class}"
  gpus: "${placement.gpus}"
  seeds: "${cell.seeds}"
  # apply stays false until P5's two oracle seeds have sample SD of final
  # held-out accuracy strictly above 0.03. Extra seeds are only H1 and H2 arms
  # that are also in the selected menu (render drops the rest).
  seed_rule:
    apply: false
    threshold: 0.03
    extra_seeds: [3, 4]
    arms:
      - noise_fp
      - fp_tolerance
      - noise_fp_tolerance
      - fp_trigger
      - noise_fp_trigger
      - fp_hash
      - noise_fn
      - fn_behavior
      - fn_prompt_subset
  arms: "${menu.arms}"
  eval_generator:
    backend: vllm
    kwargs:
      gpu_memory_utilization: "${placement.vllm_gpu_memory_utilization}"
      tensor_parallel_size: "${placement.tp}"
      seed: 0
      max_model_len: 8192
      chat_template_kwargs: "${model.chat_template_kwargs}"
  train:
    model_id: "${model.model_id}"
    model_revision: "${model.revision}"
    chat_template_kwargs: "${model.chat_template_kwargs}"
    steps: 300
    prompts_per_step: 64
    group_size: 8
    max_tokens: 1536
    eval_max_tokens: 1536
    temperature: 1.0
    lr: "${model.lr}"
    warmup_steps: 10
    beta_kl: 0.0
    loss_agg: seq_mean
    adv_mode: std
    num_iterations: 1
    grad_clip: 1.0
    micro_batch_size: "${placement.micro_batch_size}"
    gradient_checkpointing: true
    data_regime: multi_epoch
    eval_every: 25
    save_every: 25
    eval_heldout_n: 384
    eval_train_n: 128
    eval_samples_per_prompt: 4
    eval_temperature: 1.0
    use_vllm: true
    vllm_mode: colocate
    vllm_gpu_memory_utilization: "${placement.vllm_gpu_memory_utilization}"
    vllm_tensor_parallel_size: "${placement.tp}"
    lora_seed: 0
    lora:
      rank: 16
      alpha: 32
      dropout: 0.0
      keys: "${model.lora_keys}"
      num_layers: -1

analysis:
  hypotheses: true
  final_step: 300
  margin: 0.05
  alpha: 0.05
  level: 0.95
  n_boot: 10000
  seed: 0
  oracle_gain_min: 0.10
  j_split: train
  allow_partial_menu: false
  withdrawal: {rate_miss_max: 0.02}
  knife_edge: {rise: 0.05, fall: 0.10}
  early: {enabled: true, seed: 99, steps: 25}
  # h1.beside is required on every menu. An omitted beside key falls back to
  # the chain-sum decoy contrast inside the confirmatory report.
  # H1 difference is control minus arm. H8 difference is patch_tau minus
  # patch_rate. h8 is only on full: core does not train the patch arms.
  by_menu:
    full:
      h1:
        contrasts:
          - {control: noise_fp_tolerance, arm: fp_tolerance}
          - {control: noise_fp_trigger, arm: fp_trigger}
          - {control: noise_fn, arm: fn_behavior}
        beside: []
      h2:
        contrasts:
          - {control: noise_fp, arm: fp_hash}
          - {control: noise_fn, arm: fn_prompt_subset}
      h3:
        min_pairs: 4
        pairs:
          - {arm: fp_tolerance, control: noise_fp_tolerance}
          - {arm: fp_hash, control: noise_fp}
          - {arm: fp_trigger, control: noise_fp_trigger}
          - {arm: fp_trigger_enriched, control: noise_fp_trigger_enriched}
          - {arm: fn_behavior, control: noise_fn}
          - {arm: fn_behavior_depleted, control: noise_fn_depleted}
          - {arm: fn_prompt_subset, control: noise_fn}
          - {arm: natural, control: noise_natural}
          - {arm: natural_strict, control: noise_natural_strict}
      h10:
        pairs:
          - {a: fp_trigger_enriched, b: fp_trigger}
          - {a: fn_behavior_depleted, b: fn_behavior}
      h4:
        shared: [fp_tolerance, fp_trigger, fp_trigger_enriched, fn_behavior, fn_behavior_depleted]
        prompt_specific: [fp_hash, fn_prompt_subset]
        shared_min: 0.65
        prompt_specific_max: 0.60
      natural:
        - {natural: natural, control: noise_natural, oracle: oracle}
        - {natural: natural_strict, control: noise_natural_strict, oracle: oracle}
      h8:
        arm: patch_tau
        baseline: patch_rate
      # Outside h1, h2, h3, h4, and natural. Full cells only.
      reported:
        - {arm: random, kind: random}
    core:
      h1:
        contrasts:
          - {control: noise_fp_trigger, arm: fp_trigger}
          - {control: noise_fn, arm: fn_behavior}
        beside: []
      h2:
        contrasts:
          - {control: noise_fp, arm: fp_hash}
          - {control: noise_fn, arm: fn_prompt_subset}
      h3:
        min_pairs: 4
        pairs:
          - {arm: fp_hash, control: noise_fp}
          - {arm: fp_trigger, control: noise_fp_trigger}
          - {arm: fn_behavior, control: noise_fn}
          - {arm: fn_prompt_subset, control: noise_fn}
          - {arm: natural, control: noise_natural}
      h4:
        shared: [fp_trigger, fn_behavior]
        prompt_specific: [fp_hash, fn_prompt_subset]
        shared_min: 0.65
        prompt_specific_max: 0.60
      natural: {natural: natural, control: noise_natural, oracle: oracle}

# Token rates are single-GPU H100 rates at reference_params_b. The planner
# prices one job at a time and scales by params_b / reference_params_b.
# full_runs is 21 arms x 3 seeds. The seed rule's 9 arms add 2 seeds each
# (81) when apply is true. full_runs is not read by the planner.
# mean_completion_len is an estimate, not a measured length.
cost_model:
  reference_params_b: 1.7
  mean_completion_len: 700
  steps: 300
  prompts_per_step: 64
  group_size: 8
  full_runs: 63
  full_runs_if_extra_seeds: 81
  early_runs: 21
  early_steps: 25
  eval_every: 25
  eval_prompts: 384
  eval_train_prompts: 128
  eval_samples: 4
  transfer_prompts: 384
  audit_prompts: 1408
  audit_samples: 16
  h100_gen_tok_s: 10000
  h100_train_tok_s: 30000
  overhead: 1.25
  usd_per_h100_hour: 2.5
